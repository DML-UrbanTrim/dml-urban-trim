    /* =====================================
       DATE
    ===================================== */

    function formatDate(value) {

      if (!value) {
        return "Date not available";
      }

      return new Date(
        `${value}T00:00:00`
      ).toLocaleDateString(
        "en-NG",
        {
          weekday: "short",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );
    }


    /* =====================================
       MONEY
    ===================================== */

    function formatMoney(amount) {

      const naira =
        Number(amount || 0) / 100;

      if (
        !Number.isFinite(naira) ||
        naira <= 0
      ) {
        return null;
      }

      return `₦${naira.toLocaleString("en-NG")}`;
    }


    /* =====================================
       SECURITY
    ===================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================
       START HAIR TINTING PAYMENT
    ===================================== */

    async function payForTinting(
      reference,
      button
    ) {

      try {

        button.disabled = true;

        button.textContent =
          "Preparing payment...";


        if (!window.dmlSupabase) {

          throw new Error(
            "Account sign-in is not available."
          );
        }


        const {
          data: {
            session
          }
        } =
          await window.dmlSupabase.auth.getSession();


        if (!session) {

          window.location.assign(
            `account.html?next=${encodeURIComponent(
              "my-bookings.html"
            )}`
          );

          return;
        }


        const response =
          await fetch(
            "/api/paystack",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                Authorization:
                  `Bearer ${session.access_token}`
              },

              body:
                JSON.stringify({

                  service:
                    "Hair Tinting",

                  reference

                })
            }
          );


        let data;

        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "The payment server returned an invalid response."
          );
        }


        if (
          !response.ok ||
          !data.accessCode ||
          !data.reference
        ) {

          throw new Error(
            data.message ||
            "Unable to start payment."
          );
        }


        if (
          typeof PaystackPop ===
          "undefined"
        ) {

          throw new Error(
            "Paystack could not be loaded. Please refresh the page and try again."
          );
        }


        const popup =
          new PaystackPop();


        popup.resumeTransaction(
          data.accessCode
        );


        button.textContent =
          "Payment window opened";


        watchForPaymentConfirmation(
          data.reference
        );

      } catch (error) {

        console.error(
          "Hair Tinting payment error:",
          error
        );


        const card =
          button.closest(
            ".history-item"
          );


        const paymentMessage =
          card?.querySelector(
            ".payment-message"
          );


        if (paymentMessage) {

          paymentMessage.textContent =
            error.message ||
            "Unable to start payment.";

        }


        button.disabled = false;

        button.textContent =
          "Pay Now";
      }
    }
