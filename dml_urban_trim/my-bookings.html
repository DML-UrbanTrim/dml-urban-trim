<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings | DML Urban Trim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .booking-history { max-width: 850px; margin: 48px auto; }
    .history-item { border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 20px; margin: 14px 0; }
    .history-item h2 { margin: 0 0 8px; }
    .history-item p { margin: 5px 0; }
    .history-status { text-transform: capitalize; font-weight: 700; }
    .history-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  </style>
</head>
<body data-require-auth="true">
  <main class="container booking-history">
    <p class="eyebrow"><span></span> YOUR ACCOUNT</p>
    <h1>Your booking <em>history.</em></h1>
    <p id="historyMessage" role="status" aria-live="polite">Loading your bookings...</p>
    <div id="bookingHistory"></div>
    <div class="history-actions">
      <a class="btn btn-gold" href="booking.html">Book an appointment <span>→</span></a>
      <a class="location-button auth-logout" href="account.html">Log out</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const message = document.getElementById("historyMessage");
    const history = document.getElementById("bookingHistory");
    const formatDate = value => new Date(`${value}T00:00:00`).toLocaleDateString("en-NG", { weekday: "short", day: "numeric", month: "long", year: "numeric" });

    async function loadHistory() {
      if (!window.dmlSupabase) return message.textContent = "Account sign-in has not been configured yet.";
      const { data: { session } } = await window.dmlSupabase.auth.getSession();
      if (!session) return;
      const response = await fetch("/api/my-bookings", { headers: { Authorization: `Bearer ${session.access_token}` } });
      const data = await response.json();
      if (!response.ok) return message.textContent = data.message || "Unable to load your bookings.";
      if (!data.appointments.length) return message.textContent = "You have not made any bookings yet.";
      message.textContent = "";
      history.innerHTML = data.appointments.map(booking => `
        <article class="history-item">
          <h2>${booking.service}</h2>
          <p>${formatDate(booking.appointment_date)} at ${booking.appointment_time}</p>
          <p class="history-status">Status: ${booking.status.replace("_", " ")}</p>
          <p>Reference: ${booking.reference}</p>
        </article>
      `).join("");
    }
    loadHistory();
  </script>
</body>
</html>
